name: Refresh profile telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate-activity.mjs"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Generate public activity telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: Ingaleee
        run: node scripts/generate-activity.mjs

      - name: Commit refreshed telemetry
        run: |
          if git diff --quiet; then
            echo "Telemetry is already current."
            exit 0
          fi
          git config user.name "ingaleee-telemetry-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-dark.svg assets/activity-light.svg assets/activity-professional.svg
          git commit -m "chore: refresh profile telemetry"
          git push
