    <clipPath id="mobileLog0"><rect x="52" y="104" width="610" height="39"/></clipPath><clipPath id="mobileLog1"><rect x="52" y="138" width="610" height="39"/></clipPath><clipPath id="mobileLog2"><rect x="52" y="172" width="610" height="39"/></clipPath><clipPath id="mobileLog3"><rect x="52" y="206" width="610" height="39"/></clipPath><clipPath id="mobileLog4"><rect x="52" y="240" width="610" height="39"/></clipPath><clipPath id="mobileLog5"><rect x="52" y="274" width="610" height="39"/></clipPath><clipPath id="mobileLog6"><rect x="52" y="308" width="610" height="39"/></clipPath><clipPath id="mobileLog7"><rect x="52" y="342" width="610" height="39"/></clipPath>
