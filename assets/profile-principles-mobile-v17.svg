<svg xmlns="http://www.w3.org/2000/svg" width="720" height="858" viewBox="0 0 720 858" role="img" aria-labelledby="title desc"><title id="title">Reliability by design: Plan for partial failures, observability and graceful degradation. Performance with evidence: Measure, profile and optimize. Use data to guide decisions. Pragmatic architecture: Simple, maintainable solutions that solve real problems. Production ownership: From design and deployment to monitoring and incident resolution.</title><desc id="desc">Reliability by design: Plan for partial failures, observability and graceful degradation. Performance with evidence: Measure, profile and optimize. Use data to guide decisions. Pragmatic architecture: Simple, maintainable solutions that solve real problems. Production ownership: From design and deployment to monitoring and incident resolution.</desc><defs><style>.sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,Menlo,monospace}</style></defs><rect x="2" y="2" width="716" height="196" rx="16" fill="#080f16" stroke="#263947" stroke-width="2"/><g transform="translate(22 21) scale(1.75)" fill="none" stroke="#64dcec" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 3v6c0 5-8 9-8 9S4 17 4 12V6z"/><path d="m8 12 3 3 5-6"/></g><text x="84" y="55" class="sans" font-size="34" font-weight="700" fill="#f0f6fc" >Reliability by design</text><text x="22" y="117" class="sans" font-size="30" font-weight="400" fill="#a0b4c3" >Plan for partial failures, observability</text><text x="22" y="158" class="sans" font-size="30" font-weight="400" fill="#a0b4c3" >and graceful degradation.</text><rect x="2" y="222" width="716" height="196" rx="16" fill="#080f16" stroke="#263947" stroke-width="2"/><g transform="translate(22 241) scale(1.75)" fill="none" stroke="#64dcec" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m14 2-9 12h7l-2 8 9-12h-7z"/></g><text x="84" y="275" class="sans" font-size="34" font-weight=