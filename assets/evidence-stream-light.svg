<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Production evidence stream</title>
  <desc id="desc">Animated evidence stream showing production systems, measurable engineering outcomes and active backend domains.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#d7e2e7" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="62%" cy="32%" r="78%">
      <stop offset="0" stop-color="#dff5f7" stop-opacity=".8"/>
      <stop offset=".56" stop-color="#eef3f6" stop-opacity=".18"/>
      <stop offset="1" stop-color="#eef3f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#007f92" stop-opacity="0"/>
      <stop offset=".5" stop-color="#007f92" stop-opacity=".25"/>
      <stop offset="1" stop-color="#007f92" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#8095a0" flood-opacity=".28"/>
    </filter>
    <clipPath id="frame"><rect x="10" y="10" width="1180" height="480" rx="22"/></clipPath>
    <clipPath id="log0"><rect x="58" y="112" width="0" height="38"><animate attributeName="width" from="0" to="650" dur=".45s" begin="0.42s" fill="freeze" calcMode="spline" keySplines=".22 .8 .24 1"/></rect></clipPath><clipPath id="log1"><rect x="58" y="145" width="0" height="38"><animate attributeName="width" from="0" to="650" dur=".45s" begin="0.59s" fill="freeze" calcMode="spline" keySplines=".22 .8 .24 1"/></rect></clipPath><clipPath id="log2"><rect x="58" y="178" width="0" height="38"><animate attributeName="width" from="0" to="650" dur=".45s" begin="0.76s" fill="freeze" calcMode="spline" keySplines=".22 .8 .24 1"/></rect></clipPath><clipPath id="log3"><rect x="58" y="211" width="0" height="38"><animate attributeName="width" from="0" to="650" dur=".45s" begin="0.93s" fill="freeze" calcMode="spline" keySplines=".22 .8 .24 1"/></rect></clipPath><clipPath id="log4"><rect x="58" y="244" width="0" height="38"><animate attributeName="width" from="0" to="650" dur=".45s" begin="1.10s" fill="freeze" calcMode="spline" keySplines=".22 .8 .24 1"/></rect></clipPath><clipPath id="log5"><rect x="58" y="277" width="0" height="38"><animate attributeName="width" from="0" to="650" dur=".45s" begin="1.27s" fill="freeze" calcMode="spline" keySplines=".22 .8 .24 1"/></rect></clipPath><clipPath id="log6"><rect x="58" y="310" width="0" height="38"><animate attributeName="width" from="0" to="650" dur=".45s" begin="1.44s" fill="freeze" calcMode="spline" keySplines=".22 .8 .24 1"/></rect></clipPath><clipPath id="log7"><rect x="58" y="343" width="0" height="38"><animate attributeName="width" from="0" to="650" dur=".45s" begin="1.61s" fill="freeze" calcMode="spline" keySplines=".22 .8 .24 1"/></rect></clipPath>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sweep { animation: sweep 7s ease-in-out infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      @keyframes sweep { 0%, 20% { transform: translateX(-360px); opacity: 0; } 38% { opacity: .7; } 62%, 100% { transform: translateX(1230px); opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect x="10" y="10" width="1180" height="480" rx="22" fill="#eef3f6" stroke="#aebdc7" stroke-width="2" filter="url(#shadow)"/>
  <g clip-path="url(#frame)">
    <rect x="10" y="10" width="1180" height="480" fill="url(#grid)" opacity=".42"/>
    <rect x="10" y="10" width="1180" height="480" fill="url(#glow)"/>
    <g opacity=".7">
    <path id="routeA" d="M52 407 C220 352 305 448 450 392 S705 350 820 396 1010 418 1148 354" fill="none" stroke="#aebdc7" stroke-width="1.2"/>
    <path id="routeB" d="M238 92 C360 44 430 122 552 88 S770 62 905 109 1055 140 1150 104" fill="none" stroke="#d4dee4" stroke-width="1"/>
    <circle r="4" fill="#007f92">
      <animateMotion path="M52 407 C220 352 305 448 450 392 S705 350 820 396 1010 418 1148 354" dur="6.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#007d58">
      <animateMotion path="M238 92 C360 44 430 122 552 88 S770 62 905 109 1055 140 1150 104" dur="5.4s" begin=".8s" repeatCount="indefinite"/>
    </circle>
  </g>
    <rect class="sweep" x="-360" y="48" width="180" height="420" fill="url(#scan)" transform="skewX(-12)"/>
  </g>

  <rect x="10" y="10" width="1180" height="42" rx="21" fill="#f9fbfc" stroke="#aebdc7"/>
  <circle cx="34" cy="31" r="4.5" fill="#ec5f67"/>
  <circle cx="51" cy="31" r="4.5" fill="#f4bf75"/>
  <circle cx="68" cy="31" r="4.5" fill="#007d58"/>
  <text x="600" y="35" text-anchor="middle" class="mono" font-size="11" letter-spacing=".8" fill="#536976">ingaleee@production ~ tail -f evidence.stream</text>
  <circle cx="1157" cy="31" r="4" fill="#007d58" class="pulse"/>
  <text x="1144" y="35" text-anchor="end" class="mono" font-size="9" letter-spacing="1" fill="#78909d">LIVE</text>

  <rect x="34" y="72" width="700" height="320" rx="14" fill="#f9fbfc" fill-opacity=".92" stroke="#aebdc7"/>
  <text x="58" y="103" class="mono" font-size="10" font-weight="800" letter-spacing="1.5" fill="#007f92">PRODUCTION EVIDENCE STREAM</text>
  <text x="710" y="103" text-anchor="end" class="mono" font-size="9" letter-spacing="1" fill="#78909d">NO DEMOS / NO VANITY METRICS</text>
  <g clip-path="url(#log0)">
        <text x="58" y="132" class="mono" font-size="12.5" fill="#78909d">12:04:17</text>
        <text x="140" y="132" class="mono" font-size="13.5" font-weight="800" fill="#007d58">SEARCH</text>
        <text x="232" y="132" class="mono" font-size="14.5" font-weight="520" fill="#10202a">query-engine      p95=150ms / HEALTHY</text>
        
      </g><g clip-path="url(#log1)">
        <text x="58" y="165" class="mono" font-size="12.5" fill="#78909d">12:04:18</text>
        <text x="140" y="165" class="mono" font-size="13.5" font-weight="800" fill="#007d58">EVENTS</text>
        <text x="232" y="165" class="mono" font-size="14.5" font-weight="520" fill="#10202a">kafka-workers     heavy load isolated</text>
        
      </g><g clip-path="url(#log2)">
        <text x="58" y="198" class="mono" font-size="12.5" fill="#78909d">12:04:19</text>
        <text x="140" y="198" class="mono" font-size="13.5" font-weight="800" fill="#aa6a00">RAG</text>
        <text x="232" y="198" class="mono" font-size="14.5" font-weight="520" fill="#10202a">knowledge-v42     zero-downtime rollout</text>
        
      </g><g clip-path="url(#log3)">
        <text x="58" y="231" class="mono" font-size="12.5" fill="#78909d">12:04:20</text>
        <text x="140" y="231" class="mono" font-size="13.5" font-weight="800" fill="#aa6a00">PAYMENTS</text>
        <text x="232" y="231" class="mono" font-size="14.5" font-weight="520" fill="#10202a">callback-router    idempotent + reconciled</text>
        
      </g><g clip-path="url(#log4)">
        <text x="58" y="264" class="mono" font-size="12.5" fill="#78909d">12:04:21</text>
        <text x="140" y="264" class="mono" font-size="13.5" font-weight="800" fill="#007d58">MEDIA</text>
        <text x="232" y="264" class="mono" font-size="14.5" font-weight="520" fill="#10202a">ingestion-pipeline retry-safe / distributed</text>
        
      </g><g clip-path="url(#log5)">
        <text x="58" y="297" class="mono" font-size="12.5" fill="#78909d">12:04:22</text>
        <text x="140" y="297" class="mono" font-size="13.5" font-weight="800" fill="#aa6a00">OBS</text>
        <text x="232" y="297" class="mono" font-size="14.5" font-weight="520" fill="#10202a">trace-fabric      MTTR delta = −70%</text>
        
      </g><g clip-path="url(#log6)">
        <text x="58" y="330" class="mono" font-size="12.5" fill="#78909d">12:04:23</text>
        <text x="140" y="330" class="mono" font-size="13.5" font-weight="800" fill="#007d58">SCALE</text>
        <text x="232" y="330" class="mono" font-size="14.5" font-weight="520" fill="#10202a">catalog-index     100K—1M SKU</text>
        
      </g><g clip-path="url(#log7)">
        <text x="58" y="363" class="mono" font-size="12.5" fill="#78909d">12:04:24</text>
        <text x="140" y="363" class="mono" font-size="13.5" font-weight="800" fill="#007f92">STATUS</text>
        <text x="232" y="363" class="mono" font-size="14.5" font-weight="760" fill="#10202a">all critical paths nominal_</text>
        <rect x="508" y="348" width="8" height="18" fill="#007f92"><animate attributeName="opacity" values="1;1;0;0" dur=".88s" repeatCount="indefinite"/></rect>
      </g>

  <rect x="758" y="72" width="408" height="320" rx="14" fill="#f9fbfc" fill-opacity=".92" stroke="#aebdc7"/>
  <text x="782" y="103" class="mono" font-size="10" font-weight="800" letter-spacing="1.5" fill="#007f92">ACTIVE SYSTEMS</text>
