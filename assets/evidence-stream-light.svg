    <text x="20" y="55" class="sans" font-size="13.5" font-weight="650" fill="#10202a">.NET 9 · PostgreSQL · Kafka</text>
    
  </g>
  <g transform="translate(782 188)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".65s" begin="1.35s" fill="freeze"/>
    <rect width="360" height="58" rx="12" fill="#ffffff" stroke="#d4dee4"/>
    <circle cx="20" cy="22" r="4" fill="#007d58">
      <animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="1.35s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="26" class="mono" font-size="10.5" font-weight="800" letter-spacing=".9" fill="#007f92">AI / RAG</text>
    <text x="20" y="55" class="sans" font-size="13.5" font-weight="650" fill="#10202a">pgvector · HNSW · ClickHouse</text>
    
  </g>
  <g transform="translate(782 256)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".65s" begin="1.55s" fill="freeze"/>
    <rect width="360" height="58" rx="12" fill="#ffffff" stroke="#d4dee4"/>
    <circle cx="20" cy="22" r="4" fill="#007d58">
      <animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="1.55s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="26" class="mono" font-size="10.5" font-weight="800" letter-spacing=".9" fill="#007f92">LENDING + PAYMENTS</text>
    <text x="20" y="55" class="sans" font-size="13.5" font-weight="650" fill="#10202a">C# · SQL Server · REST</text>
    
  </g>
  <g transform="translate(782 324)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".65s" begin="1.75s" fill="freeze"/>
    <rect width="360" height="58" rx="12" fill="#ffffff" stroke="#d4dee4"/>
    <circle cx="20" cy="22" r="4" fill="#007d58">
      <animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="1.75s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="26" class="mono" font-size="10.5" font-weight="800" letter-spacing=".9" fill="#007f92">PLATFORM</text>
    <text x="20" y="55" class="sans" font-size="13.5" font-weight="650" fill="#10202a">Kubernetes · OTel · Grafana</text>
    
  </g>

  <g transform="translate(34 418)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".7s" begin="2s" fill="freeze"/>
    <text x="0" y="0" class="mono" font-size="9" letter-spacing="1.1" fill="#78909d">INDEPENDENT NODES</text>
    <g transform="translate(0 17)">
      <rect width="230" height="34" rx="17" fill="#ffffff" stroke="#d4dee4"/>
      <circle cx="18" cy="17" r="3.5" fill="#007d58"/>
      <text x="31" y="21" class="mono" font-size="10.5" font-weight="700" fill="#10202a">TRUSTHUB / GO + TON</text>
    </g>
    <g transform="translate(245 17)">
      <rect width="230" height="34" rx="17" fill="#ffffff" stroke="#d4dee4"/>
      <circle cx="18" cy="17" r="3.5" fill="#007d58"/>
      <text x="31" y="21" class="mono" font-size="10.5" font-weight="700" fill="#10202a">MPLX / C++20 + VM</text>
    </g>
    <g transform="translate(490 17)">
      <rect width="250" height="34" rx="17" fill="#ffffff" stroke="#d4dee4"/>
      <circle cx="18" cy="17" r="3.5" fill="#007d58"/>
      <text x="31" y="21" class="mono" font-size="10.5" font-weight="700" fill="#10202a">VPN / VLESS + WIREGUARD</text>
    </g>
    <text x="1132" y="39" text-anchor="end" class="mono" font-size="10" letter-spacing="1.1" fill="#007f92">OPEN TO INTERNATIONAL REMOTE + RELOCATION</text>
